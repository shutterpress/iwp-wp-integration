name: FluentCart integration
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: FluentCart behavior
        run: php tests/fluentcart.php
      - name: Reservation behavior
        run: php tests/reservations.php
      - name: Check removed commerce dependency
        run: '! grep -REn "IWP_Woo_|wc_get_|wcs_get_|woocommerce_|WC_Subscriptions|class_exists\(.WooCommerce" includes iwp-wp-integration.php assets'
      - name: JavaScript syntax
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
